name: Escuela Tick Worker

on:
  schedule:
    - cron: '* * * * *' # Se ejecuta cada minuto
  workflow_dispatch: # Permite ejecutarlo manualmente para probar

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar Tick a Bilt
        run: |
          curl -X POST https://898d66a5-fd1e-4a85-94b8-f200c01feb08.cloud.bilt.me/functions/v1/escuela-cascada \
          -H "Authorization: Bearer ${{ secrets.BAILEYS_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"action": "tick"}'
